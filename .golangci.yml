version: "2"

run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (*archive/zip.ReadCloser).Close
        - (io.ReadCloser).Close
  exclusions:
    paths:
      - bin
      - out
      - samples
      - tmp
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: internal/render/(frontmatter|markdown)\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - bin
      - out
      - samples
      - tmp
